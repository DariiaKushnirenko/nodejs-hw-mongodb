tags:
  - Contacts
summary: Get all contacts
operationId: getAllContacts
description: 'Get all contacts for the authenticated user'
security:
  - bearerAuth: []
parameters:
  - in: query
    name: contactType
    schema:
      type: string
      enum: [work, home, personal]
    description: Filter contacts by type
    example: work
  - in: query
    name: isFavourite
    schema:
      type: boolean
    description: Filter contacts by favourite flag
    example: true
responses:
  '200':
    description: Successfully found contacts!
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully found contacts!
            data:
              type: array
              items:
                $ref: '../../components/schemas/contact.yaml'
                page:
                  type: number
                  example: 2
                perPage:
                  type: number
                  example: 4
                totalItems:
                  type: number
                  example: 4
                totalPages:
                  type: number
                  example: 4
                hasNextPage:
                  type: boolean
                  example: false
                hasPreviousPage:
                  type: boolean
                  example: true
  '404':
    $ref: '../../components/responses/404.yaml'
