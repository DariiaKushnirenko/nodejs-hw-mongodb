tags:
  - Contacts
summary: Get list of contacts
operationId: getContacts
description: 'Get list of users with this endpoint'
security:
  - bearerAuth: []
parameters:
  - in: query
    name: page
    schema:
      type: integer
      example: 1
    description: "Page number for pagination"
  - in: query
    name: perPage
    schema:
      type: integer
      example: 10
    description: "Number of items per page"
  - in: query
    name: sortBy
    schema:
      type: string
      example: '_id'
    description: "Field to sort by. Default is _id"
  - in: query
    name: sortOrder
    schema:
      type: string
      enum: ['asc', 'desc']
      example: 'asc'
    description: "Sort order: ascending or descending"
  - in: query
    name: contactType
    schema:
      type: string
      enum: ['work', 'home', 'personal']
      example: 'work'
    description: "Filter by type of contact"
  - in: query
    name: isFavourite
    schema:
      type: boolean
      example: true
    description: "Filter by favourite contacts"
  - in: query
    name: name
    schema:
      type: string
      example: 'John'
    description: "Filter by contact name"
  - in: query
    name: phoneNumber
    schema:
      type: string
      example: '+1234567890'
    description: "Filter by phone number"
  - in: query
    name: email
    schema:
      type: string
      example: 'johndoe@example.com'
    description: "Filter by email"
  - in: query
    name: userId
    schema:
      type: string
      example: '65e4decdd286b30065d54af9'
    description: "Filter by user ID"
responses:
  '200':
    description: Successfully found contacts!
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully found contacts!
            data:
              type: object
              required:
                - data
                - page
                - perPage
                - totalItems
                - totalPages
                - hasNextPage
                - hasPreviousPage
              properties:
                data:
                  type: array
                  items:
                    type: object
                    required:
                      - name
                      - phoneNumber
                      - contactType
                      - userId
                    properties:
                      name:
                        type: string
                        example: 'John Doe'
                      phoneNumber:
                        type: string
                        example: '+1234567890'
                      email:
                        type: string
                        format: email
                        example: 'johndoe@example.com'
                      isFavourite:
                        type: boolean
                        example: false
                      contactType:
                        type: string
                        enum: ['work', 'home', 'personal']
                        example: 'work'
                      userId:
                        type: string
                        example: '65e4decdd286b30065d54af9'
                      photo:
                        type: string
                        format: binary
                      createdAt:
                        type: string
                        format: date-time
                        example: '2025-03-10T12:34:56.789Z'
                      updatedAt:
                        type: string
                        format: date-time
                        example: '2025-03-15T09:20:30.456Z'
                page:
                  type: integer
                  example: 1
                perPage:
                  type: integer
                  example: 10
                totalItems:
                  type: integer
                  example: 50
                totalPages:
                  type: integer
                  example: 5
                hasNextPage:
                  type: boolean
                  example: true
                hasPreviousPage:
                  type: boolean
                  example: false
  '404':
    description: No contacts found
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
          properties:
            status:
              type: integer
              example: 404
            message:
              type: string
              example: No contacts found matching the criteria
