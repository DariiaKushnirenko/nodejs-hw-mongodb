type: object
required:
  - name
  - phoneNumber
  - contactType
  - userId
properties:
  name:
    type: string
    example: John Doe
  phoneNumber:
    type: string
    example: '+1234567890'
  email:
    type: string
    example: johndoe@example.com
  isFavourite:
    type: boolean
    example: false
  contactType:
    type: string
    enum:
      - work
      - home
      - personal
    example: work
  userId:
    type: string
    example: 65e4decdd286b30065d54af9
  photo:
    type: string
    format: binary
